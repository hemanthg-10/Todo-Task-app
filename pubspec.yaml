name: taskstreak
description: Offline-first task planner with reminders and streak tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.6
  image_picker: ^1.2.0
  flutter_local_notifications: ^23.0.2
  audioplayers: ^6.8.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  alarm: ^5.15.0
  google_fonts: ^9.0.0
  lottie: ^3.8.2
  intl: ^0.20.2
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/authors/
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/taskstreak_logo.png
  adaptive_icon_background: "#075E58"
  adaptive_icon_foreground: assets/images/taskstreak_logo.png
  min_sdk_android: 23
